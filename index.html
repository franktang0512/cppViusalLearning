<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看得見的 C++：一步一步看程式怎麼跑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="課程目錄"></nav>
  <main>
    <div class="modebar" role="group" aria-label="切換模式">
      <button class="mode-btn" id="modeCpp" aria-pressed="true">C++</button>
      <button class="mode-btn" id="modeFlow" aria-pressed="false">流程圖</button>
    </div>
    <div id="flowView" class="flow-view" hidden>
      <div class="flow-bar"><span class="hint">流程圖模式（目前嵌入原本的流程圖網站）</span><a class="small-btn" id="flowOpen" href="https://franktang0512.github.io/flowchart/" target="_blank" rel="noopener">在新分頁開啟</a></div>
      <iframe id="flowFrame" title="流程圖編輯器"></iframe>
    </div>
    <div class="wrap" id="cppView">
      <div class="topbar"><button class="btn" id="menu">☰ 目錄</button></div>
      <div class="lesson-head">
        <div>
          <div class="crumb" id="crumb"></div>
          <h1 id="title"></h1>
          <p class="goal" id="goal"></p>
          <div id="task"></div>
          <div class="tags" id="tags"></div>
        </div>
        <div class="lnav"><button class="btn" id="prevL">← 上一課</button><button class="btn" id="nextL">下一課 →</button></div>
      </div>

      <div class="grid">
        <section class="panel">
          <div class="ph"><h2>程式碼</h2><span class="sp"></span><button class="small-btn" id="editBtn">改改看</button></div>
          <div id="codeArea"></div>
          <div class="controls" id="ctl">
            <button class="btn" id="reset">重來</button>
            <button class="btn" id="prev" title="鍵盤 ← 也可以">上一步</button>
            <button class="btn primary" id="next" title="鍵盤 → 也可以">下一步</button>
            <button class="btn" id="play">▶ 自動</button>
            <button class="btn" id="end">到最後</button>
            <span class="count" id="count"></span>
          </div>
          <input type="range" class="scrub" id="scrub" min="0" value="0" aria-label="拖曳到任一步">
          
          <div class="note" id="note"></div>
          
        </section>

        <div class="right">
          <section class="panel">
            <div class="ph"><h2 id="memTitle">記憶體</h2><span class="sp"></span>
              <button class="small-btn" id="tabMem" aria-pressed="true">記憶體</button>
              <button class="small-btn" id="tabTT" aria-pressed="false">追蹤表</button></div>
            <div id="memView"><div class="mem" id="mem"></div>
              <div class="legend" id="memLegend"></div></div>
            <div id="ttView" hidden><div class="tt-wrap" id="tt"></div>
              <div class="legend">黃底＝那一步改變的值。</div></div>
          </section>
          <section class="panel io-grid">
            <div><div class="ph"><h2>輸入（鍵盤打的）</h2></div><div id="inwrap"></div></div>
            <div><div class="ph"><h2>輸出（螢幕上）</h2><span class="sp"></span><button class="small-btn" id="wsBtn" aria-pressed="false">顯示空白</button></div><pre class="console" id="console"></pre></div>
          </section>
          <section class="panel" id="judge" hidden></section>
        </div>
      </div>
      <footer>教學用簡化模型：只支援 C++ 的一部分語法（int、long long、double、char、bool、string、陣列、if、while、for、cin、cout）。真實電腦的位址與垃圾值每次執行都可能不同。</footer>
    </div>
  </main>
</div>
<script src="js/interpreter.js"></script>
<script src="js/lessons/_base.js"></script>
<script src="js/lessons/ch00-intro.js"></script>
<script src="js/lessons/ch01-io.js"></script>
<script src="js/lessons/ch02-variables.js"></script>
<script src="js/lessons/ch03-if.js"></script>
<script src="js/lessons/ch04-loops.js"></script>
<script src="js/lessons/ch05-arrays.js"></script>
<script src="js/lessons/problems-114.js"></script>
<script src="js/lessons/upcoming.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
